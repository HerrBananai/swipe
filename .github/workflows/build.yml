name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace2>&1 | tee build-output.txt

      - name: Publish errors to job summary
        if: failure()
        run: |
          {
            echo "### Build failed - last 250 log lines"
            echo '```'
            tail -250 build-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-output.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: swipeclean-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
