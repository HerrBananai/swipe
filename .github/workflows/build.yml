name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace2>&1 | tee build-output.txt

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-output.txt

      - name: Publish failure log to ci-logs branch
        if: failure()
        run: |
          if [ ! -f build-output.txt ]; then echo "no build log produced"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-logs-tmp
          git rm -rq . || true
          cp build-output.txt ci-build-output.txt
          git add ci-build-output.txt
          git commit -m "Build log for $GITHUB_SHA"
          git push -f origin HEAD:ci-logs

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: swipeclean-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
